<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন প্যানেল - ট্রেডমার্ক এন্ট্রি</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #218838; }
        #message { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>নতুন ট্রেডমার্ক যোগ করুন</h2>
    <form id="addCertificateForm">
        <label>সার্টিফিকেট নাম্বার:</label>
        <input type="text" id="certNo" placeholder="যেমন: TM-2026-001" required>

        <label>মালিকের নাম:</label>
        <input type="text" id="ownerName" placeholder="যেমন: Shaikat Hasan" required>

        <label>ট্রেডমার্কের নাম:</label>
        <input type="text" id="tmName" placeholder="যেমন: Smart Brand" required>

        <label>স্ট্যাটাস:</label>
        <select id="status">
            <option value="Active">Active (সক্রিয়)</option>
            <option value="Pending">Pending (অপেক্ষমাণ)</option>
            <option value="Expired">Expired (মেয়াদোত্তীর্ণ)</option>
        </select>

        <button type="submit">ডাটাবেইজে সেভ করুন</button>
    </form>
    <div id="message"></div>
</div>

<script>
    document.getElementById('addCertificateForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const messageDiv = document.getElementById('message');
        messageDiv.style.color = 'blue';
        messageDiv.innerText = 'ডাটা সেভ হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...';

        const data = {
            certificate_no: document.getElementById('certNo').value,
            owner_name: document.getElementById('ownerName').value,
            trademark_name: document.getElementById('tmName').value,
            status: document.getElementById('status').value
        };

        try {
            // নিচে আপনার Vercel-এর লাইভ লিংকটি বসাতে হবে
            const response = await fetch('https://tredmark-api-omih.vercel.app/api/add-certificate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                messageDiv.style.color = 'green';
                messageDiv.innerText = '✅ সফলভাবে ডাটাবেইজে যোগ করা হয়েছে!';
                document.getElementById('addCertificateForm').reset();
            } else {
                messageDiv.style.color = 'red';
                messageDiv.innerText = '❌ এরর: ' + (result.error || 'সেভ করা যায়নি!');
            }
        } catch (error) {
            messageDiv.style.color = 'red';
            messageDiv.innerText = '❌ সার্ভারের সাথে কানেক্ট করা যাচ্ছে না!';
        }
    });
</script>

</body>
</html>
